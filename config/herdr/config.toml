onboarding = false

[theme]
name = "terminal"

auto_switch = false
[keys]
prefix = "ctrl+a"
settings = ""
copy_mode = "prefix+y"
split_horizontal = ["prefix+s", "prefix+ctrl+s"]
split_vertical = ["prefix+v", "prefix+ctrl+v"]
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
previous_workspace = "shift+up"
next_workspace = "shift+down"
previous_tab = "shift+left"
next_tab = "shift+right"
workspace_picker = ""
new_worktree = "prefix+w"
new_workspace = "prefix+shift+w"
rename_workspace = "prefix+r"
resize_mode = ""
reload_config = "prefix+,"
goto = "prefix+space"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = true
status_indicators = "dots"
[ui.toast]
delivery = "system"

[theme.custom]
accent = "#67e4e4"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#283234"
selection_bg = "#303d40"
surface0 = "#283234"
surface1 = "#303d40"
surface_dim = "#121617"
overlay0 = "#5d6d6c"
overlay1 = "#afb6b6"
text = "#f2f3f3"
subtext0 = "#afb6b6"
mauve = "#93ecec"
green = "#67e4e4"
yellow = "#5c99d6"
red = "#fd4663"
blue = "#7a7ce4"
teal = "#96bfe9"
peach = "#fd8446"
