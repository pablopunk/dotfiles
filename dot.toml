[git]
check = "command -v gh && command -v delta"
install.mise = "mise install gh delta && mise use -g gh delta"
uninstall.mise = "mise uninstall gh delta"
link."config/git/gitconfig" = "~/.gitconfig"
link."config/git/gh.yml" = "~/.config/gh/config.yml"

[zsh]
install.brew = "brew install fd jq tldr tree wget zoxide zsh"
install.apt = "sudo apt install -y fd-find jq tree wget zoxide zsh"
install.dnf = "sudo dnf install -y fd-find jq tree wget zoxide zsh"
install.pacman = "pkexec pacman -S --noconfirm fd jq tree wget zoxide zsh"
install.paru = "paru -S --noconfirm fd jq tree wget zoxide zsh"
check = "zsh"
uninstall.brew = "brew uninstall fd jq tldr tree wget zoxide zsh"
uninstall.apt = "sudo apt purge -y fd-find jq tree wget zoxide zsh"
uninstall.dnf = "sudo dnf remove -y fd-find jq tree wget zoxide zsh"
uninstall.pacman = "pkexec pacman -Rs --noconfirm fd jq tree wget zoxide zsh"
uninstall.paru = "paru -Rs --noconfirm fd jq tree wget zoxide zsh"
link."config/zsh/zshrc" = "~/.zshrc"
link."config/zsh/zimrc" = "~/.zimrc"
link."config/zsh/functions" = "~/.zsh/functions"
link."config/zsh/zshrc.d/00-path.sh" = "~/.zshrc.d/00-path.sh"
link."config/zsh/zshrc.d/10-aliases.sh" = "~/.zshrc.d/10-aliases.sh"
link."config/zsh/zshrc.d/20-core-functions.sh" = "~/.zshrc.d/20-core-functions.sh"
link."config/zsh/zshrc.d/30-completions.sh" = "~/.zshrc.d/30-completions.sh"
link."config/zsh/zshrc.d/50-zoxide.sh" = "~/.zshrc.d/50-zoxide.sh"
postinstall = """
[[ -f ~/.zim/zimfw.zsh ]] || (mkdir -p ~/.zim && curl -fsSL https://github.com/zimfw/zimfw/releases/latest/download/zimfw.zsh -o ~/.zim/zimfw.zsh)
zsh -fc 'export ZIM_HOME=$HOME/.zim && source $ZIM_HOME/zimfw.zsh install'
"""

[tmux]
check = "tmux"
install.mise = "mise install tmux && mise use -g tmux"
uninstall.mise = "mise uninstall tmux"
link."config/tmux/tmux.conf" = "~/.tmux.conf"
postinstall = "[ -d ~/.tmux/plugins ] || mkdir -p ~/.tmux/plugins"

