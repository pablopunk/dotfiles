uninstall.brew = "brew uninstall tailscale"
uninstall.pacman = "pkexec pacman -Rs --noconfirm tailscale"
uninstall.paru = "paru -Rs --noconfirm tailscale"
postinstall = """
if [[ "$(uname)" == "Linux" ]]; then
  sudo -n systemctl enable --now tailscaled 2>/dev/null || echo "⚠ Run: sudo systemctl enable --now tailscaled"
fi
echo "  Run 'sudo tailscale up --operator=\$USER' to authenticate"
"""

