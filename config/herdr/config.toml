onboarding = false

[theme]
name = "catppuccin"

auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"
[keys]
prefix = "ctrl+a"
settings = ""
copy_mode = "prefix+y"
split_horizontal = ["prefix+s", "prefix+ctrl+s"]
split_vertical = ["prefix+v", "prefix+ctrl+v"]
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
previous_workspace = "shift+up"
next_workspace = "shift+down"
previous_tab = "shift+left"
next_tab = "shift+right"
workspace_picker = ""
new_worktree = "prefix+w"
new_workspace = "prefix+shift+w"
rename_workspace = "prefix+r"
resize_mode = ""
reload_config = "prefix+,"

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "hr"
width = "60%"
height = "40%"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[ui.toast]
delivery = "terminal"

[theme.custom]
accent = "#7aa2f7"
panel_bg = "#13141c"
sidebar_bg = "reset"
active_row_bg = "#1f2230"
selection_bg = "#292e42"
surface0 = "#24283b"
surface1 = "#414868"
surface_dim = "#1a1b26"
overlay0 = "#565f89"
overlay1 = "#6f78a0"
text = "#a9b1d6"
subtext0 = "#8c94bb"
mauve = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
blue = "#7aa2f7"
teal = "#449dab"
peach = "#eb927b"

[ui.sound]
enabled = false

