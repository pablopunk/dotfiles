[syncthing]
check = "syncthing"
install.brew = "brew install syncthing"
install.pacman = "pkexec pacman -S --noconfirm syncthing"
install.paru = "paru -S --noconfirm syncthing"
uninstall.brew = "brew uninstall syncthing"
uninstall.pacman = "pkexec pacman -Rs --noconfirm syncthing"
uninstall.paru = "paru -Rs --noconfirm syncthing"
link."config/syncthing/sync.conf" = "~/.config/syncthing/sync.conf"
link."config/syncthing/setup.sh" = "~/.config/syncthing/setup.sh"
postinstall = """
if [[ "$(uname)" == "Darwin" ]]; then
  brew services start syncthing
else
  systemctl --user enable --now syncthing 2>/dev/null || systemctl --user start syncthing 2>/dev/null || true
fi
"""
postlink = "./config/syncthing/setup.sh"

