[wallpapers]
link."config/wallpapers" = "~/.config/wallpapers"
postlink = """
if [[ $(uname -s) == "Darwin" ]]; then
  wallpaper="omarchy-groove.jpg"
  img_path="${HOME}/.config/wallpapers/${wallpaper}"
  osascript -e "tell application \\"System Events\\" to set picture of every desktop to \\"${img_path}\\""
fi
"""

